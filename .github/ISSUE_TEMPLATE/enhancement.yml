name: Enhancement
description: 新功能、体验优化或技术改进 / New feature, UX improvement, or technical change
title: "[Enhancement]"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        标题写「要达成什么」，不用写优先级前缀：在下方选择优先级，提交后会自动写入标题并添加标签。较大的功能或架构改动请先在 issue 中讨论方案再实现。

        Title: describe the outcome. Pick a priority below instead of typing one; it is added to the title and labels automatically. Discuss substantial features or architectural changes here before implementing them.
  - type: dropdown
    id: priority
    attributes:
      label: 优先级 / Priority
      description: 提交后会自动写入标题并添加对应标签。 / Added to the title and labels automatically after submission.
      options:
        - P0 紧急：误写磁盘、数据丢失或安全问题 / Urgent: wrong-disk writes, data loss, or security
        - P1 高：核心流程受损 / High: a core flow is broken
        - P2 中：有绕过方式或影响有限 / Medium: workaround exists or limited impact
        - P3 低：体验优化或技术债 / Low: polish or technical debt
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景 / Background
      description: 现状和要解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案 / Proposal
      description: 期望的行为或可选方案；涉及磁盘写入、分区、引导配置、PXE、协议或持久化格式时说明安全与兼容影响。
  - type: textarea
    id: scope
    attributes:
      label: 范围 / Scope
      description: 明确范围内与范围外的内容。
      placeholder: |
        范围内：…
        范围外：…
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance criteria
      placeholder: |
        - [ ] …
        - [ ] 在一次性虚拟机中完成 UEFI / Legacy 部署验证
    validations:
      required: true
