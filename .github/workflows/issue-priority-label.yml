name: Issue priority label

# 根据标题中的 [P0]–[P3] 同步优先级标签，外部提交者无需手动打标签。
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = issue.title.match(/^\[[A-Za-z]+\]\[(P[0-3])\]/);
            const wanted = match ? match[1] : null;
            const current = issue.labels.map((l) => l.name).filter((n) => /^P[0-3]$/.test(n));
            const params = { ...context.repo, issue_number: issue.number };

            // 标题没有有效优先级时保留现有标签，交给维护者分诊。
            if (!wanted) return;

            for (const name of current) {
              if (name !== wanted) {
                await github.rest.issues.removeLabel({ ...params, name });
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...params, labels: [wanted] });
            }
