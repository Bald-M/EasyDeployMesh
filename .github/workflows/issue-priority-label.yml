name: Issue priority label

# 标题中的 [P0]–[P3] 是优先级的唯一来源，并同步为标签。
# 标题还没有优先级时，从 issue 表单的「优先级」下拉框读取并写回标题。
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const params = { ...context.repo, issue_number: issue.number };

            // [Type] 后可选的优先级段；[P?] 视为未定级，会被替换。
            const prefix = issue.title.match(/^\[([A-Za-z]+)\](?:\[(P[0-3?])\])?\s*/);
            if (!prefix) return;

            let wanted = prefix[2] && prefix[2] !== 'P?' ? prefix[2] : null;

            if (!wanted) {
              const field = (issue.body ?? '').match(/^###\s*优先级[^\n]*\n+\s*(P[0-3])\b/m);
              // 表单里也没有优先级时保留现状，交给维护者分诊。
              if (!field) return;
              wanted = field[1];
              const title = `[${prefix[1]}][${wanted}]${issue.title.slice(prefix[0].length)}`;
              await github.rest.issues.update({ ...params, title });
            }

            const current = issue.labels.map((l) => l.name).filter((n) => /^P[0-3]$/.test(n));
            for (const name of current) {
              if (name !== wanted) {
                await github.rest.issues.removeLabel({ ...params, name });
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...params, labels: [wanted] });
            }
