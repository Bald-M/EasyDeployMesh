[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/agent",
  "crates/bcd",
  "crates/core",
  "crates/gho",
  "crates/service",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
