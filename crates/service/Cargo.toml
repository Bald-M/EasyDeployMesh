[package]
name = "easydeploymesh-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
chrono.workspace = true
easydeploymesh-core = { path = "../core" }
easydeploymesh-bcd = { path = "../bcd" }
easydeploymesh-gho = { path = "../gho" }
if-addrs = "0.14.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.17", features = ["io"] }
uuid.workspace = true
rand = "0.9.2"
socket2 = { version = "0.6.3", features = ["all"] }
iso9660-rs = "1.0.2"
isomage = { version = "2.1.0", default-features = false, features = ["udf"] }
hadris-iso = "2.1.0"
gpt_disk_io = { version = "0.16.2", features = ["std"] }
fatfs = "0.3.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30.1", features = ["socket", "uio"] }

[dev-dependencies]
hadris-udf = { version = "2.1.0", features = ["write"] }
reqwest.workspace = true
tempfile = "3.23.0"
